name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release title, optional"
        required: false
        default: ""
      body:
        description: "Release notes"
        required: false
        default: "Manual HanziWriting build."
      draft:
        description: "Create as draft"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate automatic tag name
        run: |
          AUTO_TAG="v$(date -u +'%Y.%m.%d-%H%M%S')"
          echo "TAG_NAME=$AUTO_TAG" >> "$GITHUB_ENV"

      - name: Download MakeMeAHanzi graphics
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-delay 2 \
            -o app/src/main/assets/graphics.txt \
            https://raw.githubusercontent.com/skishore/makemeahanzi/master/graphics.txt

      - name: Download HSK and TOCFL curriculum datasets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-delay 2 \
            -o app/src/main/assets/hsk-3.0-words-all.json \
            https://gushichinese.com/hsk-3.0/downloads/hsk-3.0-words-all.json
          curl --fail --location --retry 5 --retry-delay 2 \
            -o app/src/main/assets/tocfl-words.json \
            https://www.linzi.app/data/files/tocfl-words.json

      - name: Validate source assets
        run: |
          set -euo pipefail
          for file in cedict_ts.u8 dictionary.txt graphics.txt hsk-3.0-words-all.json tocfl-words.json; do
            path="app/src/main/assets/$file"
            test -s "$path" || {
              echo "::error::Required source asset is missing or empty: $path"
              exit 1
            }
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The prebuilt database is cached by the content hashes of all source files
      # and the generator script. It is regenerated only if an input changes.
      - name: Restore prebuilt Room database cache
        id: hanzi-db-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/hanzi_database_prebuilt.db
            app/src/main/assets/hanzi_vocabulary_metadata.db
          key: hanzi-room-db-v3-${{ runner.os }}-${{ hashFiles('app/src/main/assets/cedict_ts.u8', 'app/src/main/assets/dictionary.txt', 'app/src/main/assets/graphics.txt', 'app/src/main/assets/hsk-3.0-words-all.json', 'app/src/main/assets/tocfl-words.json', 'scripts/build_prebuilt_db.py') }}

      - name: Generate prebuilt Room database
        if: steps.hanzi-db-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/build_prebuilt_db.py \
            --assets-dir app/src/main/assets \
            --output app/src/main/assets/hanzi_database_prebuilt.db \
            --metadata-output app/src/main/assets/hanzi_vocabulary_metadata.db

      - name: Validate prebuilt database
        run: |
          python scripts/build_prebuilt_db.py \
            --assets-dir app/src/main/assets \
            --output app/src/main/assets/hanzi_database_prebuilt.db \
            --metadata-output app/src/main/assets/hanzi_vocabulary_metadata.db \
            --validate-only

      - name: Add bundled data attribution notice
        run: |
          cp scripts/DATA_ATTRIBUTION.txt app/src/main/assets/DATA_ATTRIBUTION.txt

      # These source files are build inputs only. The APK contains the compact
      # prebuilt Room database instead of the raw text/JSON source datasets.
      - name: Remove raw source assets from APK packaging
        run: |
          rm -f \
            app/src/main/assets/cedict_ts.u8 \
            app/src/main/assets/dictionary.txt \
            app/src/main/assets/graphics.txt \
            app/src/main/assets/hsk-3.0-words-all.json \
            app/src/main/assets/tocfl-words.json
          test -s app/src/main/assets/hanzi_database_prebuilt.db
          test -s app/src/main/assets/hanzi_vocabulary_metadata.db

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare release asset
        env:
          INPUT_TAG: ${{ env.TAG_NAME }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          SAFE_TAG=$(echo "$INPUT_TAG" | tr ' /' '--')
          APK_NAME="HanziWriting-${SAFE_TAG}.apk"
          RELEASE_NAME="$INPUT_RELEASE_NAME"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="$INPUT_TAG"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ inputs.body }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true
